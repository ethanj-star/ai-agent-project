spring.application.name=european-travel-agent

spring.cache.type=redis

# Redis 缓存策略
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

# Spring AI OpenAI - 阿里云百炼 DashScope (OpenAI 兼容模式)
# 1. 替换为你真实的阿里云百炼 API Key
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}

# 2. 将请求网关重定向到阿里云
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode

# 3. 指定使用的千问模型名称
spring.ai.openai.chat.options.model=qwen3.6-plus

# SerpApi - Google Flights 真实数据接入
serpapi.api-key=${SERPAPI_KEY}
