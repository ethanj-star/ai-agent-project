spring.application.name=european-travel-agent

# ── 第七阶段持久化模式 ─────────────────────────────────────────────────────────
# jdbc：使用 MAMP MySQL 作为主存储；memory：回退到内存实现，便于临时排查。
travel.persistence.type=jdbc

# ── MySQL / MAMP 主数据库 ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agent_project_trip?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Dublin&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql

# ── Redis 缓存层 ──────────────────────────────────────────────────────────────
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

# ── Spring AI OpenAI 自动配置（仅用于 Embedding，供 Pinecone 向量化）────────────
# Chat 模型已全部移交 MultiModelConfig 手动管理；此处不再配置 chat.options.model。
# spring.ai.openai.* 的唯一职责：驱动 OpenAiEmbeddingModel，为 Pinecone 生成向量。
spring.ai.openai.api-key=${DASHSCOPE_API_KEY}
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.embedding.options.model=text-embedding-v1

# ── 三擎混合模型配置（由 MultiModelConfig 手动装配，脱离自动配置控制）────────────

# 1. 闸门模型（DeepSeek Flash）& 核心模型（DeepSeek Pro）
#    共享同一个 DeepSeek API Key，通过 model 参数区分能力等级。
custom.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
custom.ai.deepseek.base-url=https://api.deepseek.com
custom.ai.deepseek.flash-model=deepseek-v4-flash
custom.ai.deepseek.pro-model=deepseek-v4-pro

# 2. 分支模型（阿里百炼 Qwen）
#    走阿里云 OpenAI 兼容通道，URL 必须带 /v1 后缀。
#    此模型同时是系统默认 ChatClient 的底座（@Primary），
#    兼容 MastermindAgent / DataExtractionAgent 的自动注入。
custom.ai.bailian.api-key=${DASHSCOPE_API_KEY}
custom.ai.bailian.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
custom.ai.bailian.model=qwen3.6-plus

# ── 第三方数据 API ─────────────────────────────────────────────────────────────
serpapi.api-key=${SERPAPI_KEY}
openweathermap.api-key=${OPENWEATHER_API_KEY}

# ── Pinecone 向量数据库 ───────────────────────────────────────────────────────
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=agentprojecttrip
